# Pile de QA de Learny pour Coolify : même architecture que docker/compose.coolify.yml (Supabase,
# web, migrations, modèles d'e-mails Auth), avec des données et des fournisseurs
# simulés pour la recette visuelle et manuelle.
#
# Différences avec la production (valeurs par défaut, toutes modifiables depuis Coolify) :
#   - APP_ENV=local : IA, Stripe et notifications simulées (aucune clé de fournisseur) ;
#   - horloge figée au 2026-11-11T12:20:00Z (ADR-0047), l'instant du jeu de démonstration ;
#   - job `seed` : jeu de démonstration SPEC-115 (Alex Perrin, SAP S/4HANA Finance…), rechargé à
#     chaque déploiement ;
#   - Mailpit : boîte aux lettres de test, protégée par mot de passe, pour lire les e-mails
#     d'inscription et les liens de connexion ;
#   - pages de démonstration /_dev activées.
#
# Coolify : application « Docker Compose » depuis le dépôt Git, Base Directory `/docker`, Docker
# Compose Location `/compose.coolify-qa.yml`. Guide : docs/operations/coolify-qa.md.
# Ne jamais y mettre de données réelles : les comptes et contenus y sont fictifs.

# SPEC-2301 — la pile de QA gagne les services Python `api-py` et `worker-py`
# (ADR-2007), déclarés dans un fichier inclus pour ne pas changer le rendu de la page
# `/_dev/sdd/SPEC-1103` (ligne de base visuelle d'une autre spécification, ADR-1001).
include:
  - path: ./compose.coolify-qa-py.yml

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Toutes les variables de l'application se pilotent depuis Coolify (onglet Environment Variables) :
# la valeur après `:-` est le défaut de recette, appliqué quand la variable est absente ou vide.
# Sans aucune variable ajoutée, la pile reste la recette figée et simulée décrite plus haut.
# Pour une recette avec les vrais fournisseurs (APP_ENV=preview) ou en mode production, voir
# docs/operations/coolify-qa.md §4 bis et ADR-0339 ; les combinaisons interdites sont refusées au
# démarrage par packages/config (checkEnvironment). NODE_ENV reste figé : l'image est un build de
# production, le mode fonctionnel passe par APP_ENV.
x-app-environment: &app-environment
  NODE_ENV: production
  # local (fournisseurs simulés) | preview (fournisseurs réels, Stripe en test) | production.
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-}
  # Empreinte du commit livré (7 à 40 caractères hexadécimaux), facultative. Pas SOURCE_COMMIT :
  # Coolify y met « unknown » quand le commit n'est pas inclus au build, valeur refusée par l'app.
  # Pas non plus en argument de build : Coolify recopie les arguments de build dans l'environnement.
  GIT_COMMIT: ${GIT_COMMIT:-}
  API_INTERNAL_URL: http://api-py:8000
  API_PROXY_SECRET: ${API_PROXY_SECRET:?}
  LEARNY_API_ROLE: all

  # Adresses et Supabase (les trois premières sont aussi intégrées au build du web).
  NEXT_PUBLIC_APP_URL: ${LEARNY_PUBLIC_APP_URL:?}
  NEXT_PUBLIC_SUPABASE_URL: ${LEARNY_PUBLIC_SUPABASE_URL:?}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/postgres
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DB_LOG_QUERIES: ${DB_LOG_QUERIES:-false}

  # Sécurité.
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
  APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
  RATE_LIMIT_IP_SECRET: ${RATE_LIMIT_IP_SECRET:?}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  # Défaut de recette : l'horloge de démonstration est figée (CLOCK_FIXED_AT), donc les seaux du
  # limiteur de débit de SPEC-208 ne se rechargent jamais d'eux-mêmes (leur fenêtre se calcule
  # avec l'horloge injectée) et un testeur qui épuise son quota resterait bloqué. La recette
  # désactive donc le limiteur ; SPEC-208 reste couvert par ses tests automatisés. Avec l'horloge
  # réelle, remettez `on` ; `off` est refusé en production (packages/config, checkEnvironment).
  RATE_LIMIT_MODE: ${RATE_LIMIT_MODE:-off}

  # IA (LLM_MODE=live exige ANTHROPIC_API_KEY ; VOYAGE_API_KEY pour les embeddings).
  LLM_MODE: ${LLM_MODE:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ALLOW_LOCAL_MODELS: ${ALLOW_LOCAL_MODELS:-false}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  SEARCH_API_KEY: ${SEARCH_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}

  # Paiement (STRIPE_MODE=test avec des clés de test Stripe ; live = vrais paiements).
  STRIPE_MODE: ${STRIPE_MODE:-mock}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

  # Notifications push (PUSH_MODE=live exige la paire VAPID).
  PUSH_MODE: ${PUSH_MODE:-mock}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:qa@learny.test}

  # Tâches de fond : le worker Python de la pile (ADR-2006).
  JOBS_MODE: ${JOBS_MODE:-inline}

  # E-mails : par défaut tous capturés par Mailpit (smtp) ; resend exige RESEND_API_KEY.
  EMAIL_MODE: ${EMAIL_MODE:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  EMAIL_FROM: ${EMAIL_FROM:-Learny QA <qa@learny.test>}
  EMAIL_LINK_SECRET: ${EMAIL_LINK_SECRET:?}
  RESEND_API_KEY: ${RESEND_API_KEY:-}

  # Observabilité (facultative).
  SENTRY_DSN: ${SENTRY_DSN:-}
  NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}

  # Mentions légales (fictives par défaut) ; versions vides = versions documentées.
  LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-Learny (environnement de QA)}
  LEGAL_ENTITY_ADDRESS: ${LEGAL_ENTITY_ADDRESS:-Adresse fictive de recette}
  LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-qa@learny.test}
  LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:-Serveur Coolify de recette}
  LEGAL_CGU_VERSION: ${LEGAL_CGU_VERSION:-}
  LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:-}

  # Horloge : absente ou vide = instant figé de la démo (ADR-0047) ; `real` = horloge réelle (la
  # commande des conteneurs web, api et seed retire alors la variable avant de lancer Node, qui
  # retombe sur l'horloge système, packages/core/src/clock.ts).
  CLOCK_FIXED_AT: ${CLOCK_FIXED_AT:-2026-11-11T12:20:00Z}
  # Pages /_dev/sdd/* : seule la valeur exacte `true` les active ; refusées en production.
  ENABLE_SDD_PAGES: ${ENABLE_SDD_PAGES:-true}

services:
  db:
    build:
      context: ..
      dockerfile: docker/coolify-support.Dockerfile
      target: db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1 -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  migrate:
    build:
      context: ..
      dockerfile: docker/coolify-support.Dockerfile
      target: migrate
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/postgres
    restart: 'no'
    exclude_from_hc: true
    logging: *logging

  # Jeu de démonstration SPEC-115, idempotent (identifiants fixes) : chaque déploiement remet les
  # données de démonstration dans leur état de référence ; les comptes créés à la main restent.
  # La garde de la seed n'accepte qu'un hôte local ou `.test` : le lien donne à `db` l'alias
  # `db.learny.test`, visible de ce seul conteneur.
  seed:
    build:
      context: ..
      dockerfile: docker/qa-seed.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      # GoTrue crée ses colonnes de auth.users au démarrage ; la seed y insère les comptes.
      auth:
        condition: service_healthy
    links:
      - db:db.learny.test
    # QA_SEED=off saute le chargement (le job se termine aussitôt, le web démarre quand même) :
    # utile avec l'horloge réelle, le jeu de démonstration étant daté du 9 au 13 novembre 2026.
    command:
      - sh
      - -c
      - >-
        if [ "$$QA_SEED" = "off" ]; then echo "seed : désactivée (QA_SEED=off)"; exit 0; fi;
        if [ "$$CLOCK_FIXED_AT" = "real" ]; then unset CLOCK_FIXED_AT; fi;
        exec pnpm exec tsx packages/db/src/seed/cli.ts
    environment:
      QA_SEED: ${QA_SEED:-on}
      APP_ENV: test
      # Le jeu de demonstration derive des que les testeurs l'utilisent (notification lue,
      # creneau deplace) : la pile de recette signale les ecarts sans refuser de demarrer.
      SEED_TOLERANT: '1'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db.learny.test:5432/postgres
      CLOCK_FIXED_AT: ${CLOCK_FIXED_AT:-2026-11-11T12:20:00Z}
    restart: 'no'
    exclude_from_hc: true
    logging: *logging

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${LEARNY_PUBLIC_SUPABASE_URL:?}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      GOTRUE_SITE_URL: ${LEARNY_PUBLIC_APP_URL:?}
      GOTRUE_URI_ALLOW_LIST: ${LEARNY_PUBLIC_APP_URL:?},${LEARNY_PUBLIC_APP_URL:?}/**
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DB_MIGRATIONS_PATH: /usr/local/etc/auth/migrations
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://auth-templates:8080/confirmation.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://auth-templates:8080/magic-link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirmez votre adresse e-mail
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Votre lien de connexion à Learny
      # Tous les e-mails d'Auth arrivent dans Mailpit.
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_ADMIN_EMAIL: qa@learny.test
      GOTRUE_SMTP_SENDER_NAME: Learny QA
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9999/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
    exclude_from_hc: true
    restart: unless-stopped
    logging: *logging

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.84.19
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: '52428800'
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:5000/status >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # API publique de Supabase. Domaine Coolify sur le port 8000 (URL = LEARNY_PUBLIC_SUPABASE_URL).
  kong:
    build:
      context: ..
      dockerfile: docker/coolify-support.Dockerfile
      target: kong
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_healthy
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  auth-templates:
    build:
      context: ..
      dockerfile: docker/coolify-support.Dockerfile
      target: auth-templates
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    expose:
      - '8080'
    restart: unless-stopped
    logging: *logging

  # Boîte aux lettres de test. Domaine Coolify sur le port 8025 ; l'interface et l'API exigent
  # MAILPIT_UI_AUTH (« utilisateur:motdepasse »). Les messages ne sont pas conservés au redémarrage.
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?}
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '2000'
    expose:
      - '8025'
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${LEARNY_PUBLIC_APP_URL:?}
        NEXT_PUBLIC_SUPABASE_URL: ${LEARNY_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
        APP_VERSION: ${APP_VERSION:-qa}
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/apps/web/.next/cache:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    command:
      - sh
      - -c
      - >-
        if [ "$$CLOCK_FIXED_AT" = "real" ]; then unset CLOCK_FIXED_AT; fi;
        exec node apps/web/server.js
    environment:
      <<: *app-environment
      API_INTERNAL_URL: http://api-py:8000
      API_PROXY_SECRET: ${API_PROXY_SECRET:?}
    expose:
      - '3000'
    depends_on:
      seed:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck-web.mjs']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  storage-data:
