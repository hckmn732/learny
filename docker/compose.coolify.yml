# Production de Learny sur Coolify, branchée sur un Supabase déjà déployé par Coolify.
#
# Ce fichier ne démarre ni Postgres, ni Auth, ni Storage, ni Kong : il rejoint le réseau Docker de la
# ressource Supabase existante (SUPABASE_NETWORK) et vise ses conteneurs par leur nom Coolify
# `<service>-<uuid>` (SUPABASE_SERVICE_UUID). Il ajoute web, worker, Inngest auto-hébergé, un job de
# migrations idempotent et le serveur interne des modèles d'e-mails Auth.
#
# Coolify : application « Docker Compose » depuis le dépôt Git, Base Directory `/docker`, Docker
# Compose Location `/compose.coolify.yml`, domaine `https://<hôte>:3000` sur le service learny-web.
# Guide complet : docs/operations/coolify.md.
#
# Les secrets viennent des variables d'environnement de la ressource Coolify. La syntaxe `:?` bloque
# le déploiement tant qu'une valeur obligatoire manque ; la liste reprend PRODUCTION_REQUIRED_KEYS
# (packages/config), que l'application revérifie au démarrage.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-app-environment: &app-environment
  NODE_ENV: production
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-}
  GIT_COMMIT: ${SOURCE_COMMIT:-}
  NEXT_PUBLIC_APP_URL: ${LEARNY_PUBLIC_APP_URL:?}
  NEXT_PUBLIC_SUPABASE_URL: ${LEARNY_PUBLIC_SUPABASE_URL:?}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
  # Connexion directe (pas Supavisor : il est en mode transaction, incompatible avec les requêtes
  # préparées de postgres.js et avec les migrations).
  DATABASE_URL: postgresql://postgres:${SUPABASE_POSTGRES_PASSWORD:?}@supabase-db-${SUPABASE_SERVICE_UUID:?}:5432/postgres
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DB_LOG_QUERIES: 'false'
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
  APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
  RATE_LIMIT_IP_SECRET: ${RATE_LIMIT_IP_SECRET:?}
  TRUST_PROXY: 'true'
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  LLM_MODE: live
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
  ALLOW_LOCAL_MODELS: ${ALLOW_LOCAL_MODELS:-false}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:?}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  SEARCH_API_KEY: ${SEARCH_API_KEY:-}
  JOBS_MODE: inngest
  INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?}
  INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?}
  INNGEST_BASE_URL: http://learny-inngest:8288
  INNGEST_DEV: '0'
  EMAIL_MODE: ${EMAIL_MODE:-resend}
  EMAIL_FROM: ${EMAIL_FROM:?}
  RESEND_API_KEY: ${RESEND_API_KEY:?}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  EMAIL_LINK_SECRET: ${EMAIL_LINK_SECRET:?}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:?}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?}
  VAPID_SUBJECT: ${VAPID_SUBJECT:?}
  PUSH_MODE: live
  STRIPE_MODE: ${STRIPE_MODE:-live}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
  STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:?}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?}
  SENTRY_DSN: ${SENTRY_DSN:-}
  NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
  LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:?}
  LEGAL_ENTITY_ADDRESS: ${LEGAL_ENTITY_ADDRESS:?}
  LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:?}
  LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:?}
  LEGAL_CGU_VERSION: ${LEGAL_CGU_VERSION:-2026-11-11}
  LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:-2026-11-11}
  ENABLE_SDD_PAGES: 'false'

services:
  # Job unique : applique supabase/migrations une seule fois par fichier, avec empreinte SHA-256
  # (public.selfhost_schema_migrations). Rejoué à chaque déploiement, il n'applique que le nouveau.
  learny-migrate:
    build:
      context: ..
      dockerfile: docker/coolify-support.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:${SUPABASE_POSTGRES_PASSWORD:?}@supabase-db-${SUPABASE_SERVICE_UUID:?}:5432/postgres
    networks: [supabase]
    restart: 'no'
    exclude_from_hc: true
    logging: *logging

  # Modèles d'e-mails de Supabase Auth (supabase/templates), joignables par GoTrue sur le réseau du
  # Supabase à http://learny-auth-templates:8080/<modèle>.html. Aucun domaine public.
  learny-auth-templates:
    build:
      context: ..
      dockerfile: docker/coolify-support.Dockerfile
      target: auth-templates
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    expose:
      - '8080'
    networks: [supabase]
    restart: unless-stopped
    logging: *logging

  learny-inngest:
    build:
      context: ..
      dockerfile: docker/coolify-support.Dockerfile
      target: inngest
    command:
      - inngest
      - start
      - --host
      - 0.0.0.0
      - --port
      - '8288'
      - --sdk-url
      - http://learny-worker:3001/api/inngest
      - --event-key
      - ${INNGEST_EVENT_KEY:?}
      - --signing-key
      - ${INNGEST_SIGNING_KEY:?}
      - --sqlite-dir
      - /var/lib/inngest
    expose:
      - '8288'
    volumes:
      - inngest-data:/var/lib/inngest
    healthcheck:
      test: ['CMD', 'perl', '/healthcheck.pl']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [default]
    restart: unless-stopped
    logging: *logging

  learny-worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${SOURCE_COMMIT:-unknown}
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      <<: *app-environment
      PORT: '3001'
    expose:
      - '3001'
    depends_on:
      learny-migrate:
        condition: service_completed_successfully
      learny-inngest:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [default, supabase]
    restart: unless-stopped
    logging: *logging

  learny-web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${LEARNY_PUBLIC_APP_URL:?}
        NEXT_PUBLIC_SUPABASE_URL: ${LEARNY_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${SOURCE_COMMIT:-unknown}
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/apps/web/.next/cache:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      <<: *app-environment
      # Cibles de la sonde docker/healthcheck-web.mjs : conteneurs du Supabase Coolify.
      REST_URL: http://supabase-rest-${SUPABASE_SERVICE_UUID:?}:3000/
      AUTH_URL: http://supabase-auth-${SUPABASE_SERVICE_UUID:?}:9999/health
      STORAGE_URL: http://supabase-storage-${SUPABASE_SERVICE_UUID:?}:5000/status
      INNGEST_URL: http://learny-inngest:8288/health
    expose:
      - '3000'
    depends_on:
      learny-migrate:
        condition: service_completed_successfully
      learny-inngest:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck-web.mjs']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    networks: [default, supabase]
    restart: unless-stopped
    logging: *logging

networks:
  # Réseau Docker de la ressource Supabase créée par Coolify (son UUID). Coolify ne le crée pas : il
  # doit exister. Repli : `coolify` si « Connect To Predefined Network » est activé sur le Supabase.
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:?}

volumes:
  inngest-data:
