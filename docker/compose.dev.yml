# Pile locale de développement (SPEC-008, ADR-0053, ADR-0054).
# Supabase est lancé par la CLI ; ce fichier ne contient que Mailpit.
# Images épinglées, aucun secret, volumes nommés pour les données locales.
name: learny-dev

services:
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8025/api/v1/info >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped
    volumes:
      - mailpit-data:/data

volumes:
  mailpit-data:
