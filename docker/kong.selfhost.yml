_format_version: '2.1'
# Public Supabase API of the self-hosted stack (SPEC-012, ET-3).
# Only these routes are published; Postgres, Auth, Storage and PostgREST stay on the internal
# `backend` network. No key is stored here: clients send the anon/service JWT as usual.
services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
