<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmez votre adresse e-mail</title>
  </head>
  <body style="margin:0;padding:24px;background:#F4F4F1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#111113">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border:1px solid #E7E6E1;border-radius:24px">
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 16px;font-size:22px">Learny</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5">Bienvenue sur Learny. Confirmez votre adresse pour activer votre compte : le lien est valable 1 heure.</p>
                <p style="margin:0">
                  <a href="{{ .SiteURL }}/api/v1/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup" style="display:inline-block;padding:12px 20px;background:#111113;color:#FFFFFF;border-radius:12px;text-decoration:none;font-weight:600">Confirmer mon adresse</a>
                </p>
                <p style="margin:24px 0 0;font-size:13px;color:#62626B">Vous n’êtes pas à l’origine de cette demande ? Ignorez ce message.</p>
          <p style="margin:8px 0 0;font-size:13px"><a href="{{ .SiteURL }}/parametres#notifications" style="color:#3A3AA8">Gérer mes notifications</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
