# Intégration continue de Learny (ADR-0052, complétée par SPEC-011).
# - `audit` et `secrets` s'exécutent toujours, même avant l'existence du monorepo.
# - Les jobs applicatifs ne s'exécutent que si `pnpm-lock.yaml` existe (SPEC-001) ; leur
#   condition dépend de la détection du job `audit`, ils ne sont jamais omis silencieusement.
# - Tous les tests tournent en modes simulés, horloge figée (ADR-0047, ADR-0048) : aucun
#   fournisseur IA, paiement ou e-mail réel n'est contacté.
# - Les rapports, captures et vidéos sont publiés en artefacts même en cas d'échec.
name: CI

on:
  push:
    branches: [main, 'spec/**', 'fix/**', 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  CLOCK_FIXED_AT: '2026-11-11T12:20:00Z'
  LLM_MODE: mock
  STRIPE_MODE: mock
  EMAIL_MODE: memory
  PUSH_MODE: mock
  ENABLE_SDD_PAGES: 'true'
  # Seuil bloquant de `pnpm audit` (EF-5) : high et critical échouent la CI.
  AUDIT_LEVEL: high
  # Conservation des artefacts de test et de sécurité (jours).
  ARTIFACT_RETENTION_DAYS: '14'
  SECURITY_ARTIFACT_RETENTION_DAYS: '30'
  # Base Supabase locale démarrée par les jobs d'intégration/e2e (SPEC-008).
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  audit:
    name: Audit du référentiel
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit SDD
        run: |
          mkdir -p audit-reports
          node tools/sdd/audit.mjs 2>&1 | tee audit-reports/audit.txt
          exit "${PIPESTATUS[0]}"
      - name: Détecter le monorepo
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publier le rapport d'audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: audit-reports/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  secrets:
    name: Sécurité (secrets et dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks sur l'historique
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Aucun commentaire de PR : le jeton reste en lecture seule (ET-1).
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # Rapport SARIF masqué conservé en artefact même en cas de fuite (ET-5).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Installer les dépendances (lockfile présent)
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Analyseur intégré de secrets
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        run: |
          mkdir -p security-reports
          pnpm exec tsx tools/security/check-secrets.ts --all 2>&1 | tee security-reports/secrets.txt
          exit "${PIPESTATUS[0]}"
      - name: Audit des dépendances
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        run: |
          mkdir -p security-reports
          pnpm audit --audit-level="${AUDIT_LEVEL}" 2>&1 | tee security-reports/pnpm-audit.txt
          exit "${PIPESTATUS[0]}"
      - name: Publier les rapports de sécurité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: ${{ env.SECURITY_ARTIFACT_RETENTION_DAYS }}

  quality:
    name: Lint, types, build, unitaires
    needs: audit
    if: needs.audit.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Tests unitaires avec couverture
        run: pnpm test:unit --coverage
      - name: Publier les rapports unitaires
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            coverage/
            test-results/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  integration:
    name: Intégration (Supabase local)
    needs: audit
    if: needs.audit.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium (preuves Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: Construire l'application (hôtes de test)
        run: pnpm build
      - name: Installer actionlint (validation des workflows)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint --version
      - name: Démarrer Supabase local
        run: supabase start
      - name: Remettre la base à zéro
        run: pnpm db:reset
      - name: Tests d'intégration
        run: pnpm test:int
      - name: Publier les rapports d'intégration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  e2e:
    name: E2E et conformité visuelle (Chromium)
    needs: audit
    if: needs.audit.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium et ses dépendances système
        run: pnpm exec playwright install --with-deps chromium
      - name: Locale française et polices
        run: |
          sudo locale-gen fr_FR.UTF-8
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core fonts-noto-core
      - name: Démarrer Supabase local
        run: supabase start
      - name: Remettre la base à zéro
        run: pnpm db:reset
      - name: Charger le jeu de démonstration
        run: pnpm db:seed:demo
      - run: pnpm build
      - name: Tests e2e, axe et visuels
        run: pnpm test:e2e
      - name: Publier les rapports, captures et vidéos e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            test-results/
            apps/web/e2e/__screenshots__/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
