<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Clés d’IA personnelles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#3A3AA8}a:hover{color:#26267A}
@keyframes lr-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes lr-badge{0%{opacity:0;transform:translateX(-6px)}100%{opacity:1;transform:none}}
@keyframes lr-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lr-lock{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(10deg)}}
@keyframes lr-glow{0%,100%{box-shadow:0 0 0 0 rgba(198,244,50,0)}50%{box-shadow:0 0 0 4px rgba(198,244,50,.4)}}
.lr-check path{stroke-dasharray:24;animation:lr-draw .6s .6s ease-out both}
.lr-ok{animation:lr-badge .45s .9s both}
.lr-form>*{animation:lr-in .5s cubic-bezier(.2,.8,.2,1) both}
.lr-form>*:nth-child(2){animation-delay:.08s}.lr-form>*:nth-child(3){animation-delay:.16s}.lr-form>*:nth-child(4){animation-delay:.24s}.lr-form>*:nth-child(5){animation-delay:.32s}.lr-form>*:nth-child(6){animation-delay:.4s}
.lr-grid>*:nth-child(5){animation:lr-glow 2.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: Inter, sans-serif; color: #111113; display: flex; flex-direction: column">
  <div style="padding: 56px 20px 10px; display: flex; align-items: center; gap: 10px">
    <button aria-label="Revenir" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E7E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62626B">Modèles d’IA</span>
  </div>
  <div class="lr-form" style="flex: 1; padding: 4px 20px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1">Ajouter une clé</h1>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 600; font-size: 14px">Fournisseur</span>
      <div class="lr-grid" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{providers}}" as="p" hint-placeholder-count="6">
          <button style="height: 48px; border-radius: 14px; border: {{p.border}}; background: {{p.bg}}; font: 600 13px Inter, sans-serif; color: {{p.ink}}">{{p.name}}</button>
        </sc-for>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 8px"><span style="font-weight: 600; font-size: 14px">Clé d’API</span>
      <input type="password" value="sk-opencode-••••••••" style="height: 52px; border-radius: 14px; border: 1px solid #DAD9D3; padding: 0 14px; font: 500 15px Inter, sans-serif; background: #FFFFFF; color: #111113">
    </label>
    <div style="display: flex; gap: 10px; align-items: center">
      <button style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #DAD9D3; background: #FFFFFF; font: 600 14px Inter, sans-serif; color: #111113">Tester la clé</button>
      <span class="lr-ok" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #0B5C4D"><svg class="lr-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F9F7F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Clé valide · 24 modèles</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 600; font-size: 14px">Modèle pour les 5 tâches</span>
      <div style="background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 16px; padding: 0 14px; min-height: 52px; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14.5px; font-weight: 500">qwen3-coder</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62626B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #62626B">Votre clé est chiffrée et ne sert qu’à vos propres demandes. Ce fournisseur traite les données hors de l’Union européenne.</p>
  </div>
  <div style="padding: 12px 20px 34px; background: #FFFFFF; border-top: 1px solid #EEEDE8">
    <button style="width: 100%; height: 52px; border-radius: 999px; border: 0; background: #C6F432; font: 600 16px Inter, sans-serif; color: #111113">Enregistrer</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const off = { border: '1px solid #E7E6E1', bg: '#FFFFFF', ink: '#111113' };
    const on = { border: '2px solid #111113', bg: '#111113', ink: '#C6F432' };
    return { providers: [
      { name: 'Anthropic', ...off }, { name: 'OpenAI', ...off }, { name: 'Mistral', ...off },
      { name: 'DeepSeek', ...off }, { name: 'OpenCode', ...on }, { name: 'Compatible', ...off },
    ] };
  }
}
</script>
</body>
</html>
