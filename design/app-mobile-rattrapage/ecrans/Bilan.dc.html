.lr-confetti i{position:absolute;top:0;width:8px;height:12px;border-radius:2px;animation:lr-fall 6s linear infinite}

.lr-hero{position:relative;overflow:hidden}.lr-hero::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:lr-sweep 4.5s ease-in-out infinite}
