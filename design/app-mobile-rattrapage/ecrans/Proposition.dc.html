<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Programme proposé</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#3A3AA8}a:hover{color:#26267A}
@keyframes lr-cascade{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes lr-twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.25) rotate(18deg);opacity:.7}}
@keyframes lr-glint{0%,60%{background-position:-150% 0}100%{background-position:250% 0}}
.lr-list>*{animation:lr-cascade .5s cubic-bezier(.2,.8,.2,1) both}
.lr-list>*:nth-child(2){animation-delay:.07s}.lr-list>*:nth-child(3){animation-delay:.14s}.lr-list>*:nth-child(4){animation-delay:.21s}.lr-list>*:nth-child(5){animation-delay:.28s}.lr-list>*:nth-child(6){animation-delay:.35s}.lr-list>*:nth-child(7){animation-delay:.42s}
.lr-twinkle{transform-box:fill-box;transform-origin:center;animation:lr-twinkle 2.4s ease-in-out infinite}
.lr-glint{background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.9) 50%,transparent 70%);background-size:200% 100%;background-repeat:no-repeat;animation:lr-glint 3.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: Inter, sans-serif; color: #111113; display: flex; flex-direction: column">
  <div style="padding: 56px 20px 10px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62626B">Proposition du tuteur</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1">Ton programme SAP S/4HANA Finance</h1>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px">
      <span style="font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E7E6E1">7 modules</span>
      <span style="font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E7E6E1">10 h / semaine</span>
      <span class="lr-glint" style="font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background-color: #EEF8CF; color: #3F5A00">Fin prévue 18 janv.</span>
    </div>
  </div>
  <div class="lr-list" style="flex: 1; padding: 8px 20px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{modules}}" as="m" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
        <span style="width: 28px; height: 28px; border-radius: 8px; background: #F0EFEA; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{m.n}}</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 14.5px">{{m.title}}</span><span style="font-size: 12.5px; color: #62626B">{{m.meta}}</span></div>
        <button aria-label="Réordonner" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62626B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg></button>
      </div>
    </sc-for>
    <div style="background: #ECECFC; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; margin-top: 2px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A3AA8" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" class="lr-twinkle" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/></svg>
      <span style="font-size: 13.5px; line-height: 1.45; color: #2E2E8F">Dis au tuteur ce qu’il faut changer : « moins de théorie », « ajoute la clôture annuelle »…</span>
    </div>
  </div>
  <div style="padding: 12px 20px 34px; background: #FFFFFF; border-top: 1px solid #EEEDE8; display: flex; gap: 10px">
    <button style="flex: 1; height: 52px; border-radius: 999px; border: 1px solid #DAD9D3; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #111113">Ajuster</button>
    <button style="flex: 1.4; height: 52px; border-radius: 999px; border: 0; background: #C6F432; font: 600 15px Inter, sans-serif; color: #111113">Valider le programme</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { modules: [
      { n: '1', title: 'Les fondamentaux de la finance SAP', meta: '6 notions · 3 h' },
      { n: '2', title: 'Écritures et plan de comptes', meta: '8 notions · 4 h' },
      { n: '3', title: 'Comptabilité fournisseurs', meta: '7 notions · 4 h' },
      { n: '4', title: 'Comptabilité clients', meta: '7 notions · 4 h' },
      { n: '5', title: 'Immobilisations', meta: '6 notions · 3 h' },
      { n: '6', title: 'Clôture mensuelle', meta: '8 notions · 5 h' },
    ] };
  }
}
</script>
</body>
</html>
