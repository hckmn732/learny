<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cadrage avec le tuteur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#3A3AA8}a:hover{color:#26267A}
@keyframes lr-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes lr-shimmer{0%{background-position:-120% 0}100%{background-position:220% 0}}
@keyframes lr-breath{0%,100%{box-shadow:0 0 0 0 rgba(91,91,214,.35)}50%{box-shadow:0 0 0 6px rgba(91,91,214,0)}}
@keyframes lr-nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(3px)}}
.lr-chat>div,.lr-chat>div>button{animation:lr-in .55s cubic-bezier(.2,.8,.2,1) both}
.lr-chat>div:nth-child(2){animation-delay:.35s}.lr-chat>div:nth-child(3){animation-delay:.7s}
.lr-chat>div>button:nth-child(1){animation-delay:1s}.lr-chat>div>button:nth-child(2){animation-delay:1.1s}.lr-chat>div>button:nth-child(3){animation-delay:1.2s}
.lr-steps>div:nth-child(2){background:linear-gradient(90deg,#111113 0%,#5B5BD6 50%,#111113 100%);background-size:200% 100%;animation:lr-shimmer 2.2s linear infinite}
.lr-picked{animation:lr-in .55s 1.1s both,lr-breath 2.4s 1.8s ease-out infinite}
.lr-send svg{animation:lr-nudge 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: Inter, sans-serif; color: #111113; display: flex; flex-direction: column">
  <div style="padding: 56px 20px 12px; display: flex; align-items: center; gap: 10px">
    <button aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E7E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600">Nouvelle formation · question 2 sur 5</span>
      <div class="lr-steps" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <div style="height: 4px; border-radius: 2px; background: #111113"></div>
        <div style="height: 4px; border-radius: 2px; background: #111113"></div>
        <div style="height: 4px; border-radius: 2px; background: #DAD9D3"></div>
        <div style="height: 4px; border-radius: 2px; background: #DAD9D3"></div>
        <div style="height: 4px; border-radius: 2px; background: #DAD9D3"></div>
      </div>
    </div>
  </div>
  <div class="lr-chat" style="flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: flex-start; max-width: 86%; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 18px 18px 18px 6px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45">Tu veux apprendre <strong>SAP S/4HANA Finance</strong>. Qu’est-ce que tu veux être capable de faire à la fin ?</div>
    <div style="align-self: flex-end; max-width: 80%; background: #111113; color: #FFFFFF; border-radius: 18px 18px 6px 18px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45">Passer la certification et clôturer un mois seul.</div>
    <div style="align-self: flex-start; max-width: 86%; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 18px 18px 18px 6px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45">Noté. Où en es-tu aujourd’hui ?</div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <button style="min-height: 48px; text-align: left; padding: 0 16px; border-radius: 14px; border: 1px solid #E7E6E1; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #111113">Je découvre complètement</button>
      <button class="lr-picked" style="min-height: 48px; text-align: left; padding: 0 16px; border-radius: 14px; border: 2px solid #5B5BD6; background: #ECECFC; font: 600 14px Inter, sans-serif; color: #2E2E8F">J’ai les bases de la comptabilité</button>
      <button style="min-height: 48px; text-align: left; padding: 0 16px; border-radius: 14px; border: 1px solid #E7E6E1; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #111113">J’utilise déjà SAP au travail</button>
    </div>
  </div>
  <div style="padding: 10px 16px 34px; background: #FFFFFF; border-top: 1px solid #EEEDE8; display: flex; gap: 8px; align-items: center">
    <label style="flex: 1; display: flex"><span style="position: absolute; left: -9999px">Ta réponse</span><input placeholder="Ou réponds avec tes mots…" style="flex: 1; height: 48px; border-radius: 999px; border: 1px solid #DAD9D3; padding: 0 16px; font: 400 14px Inter, sans-serif; background: #F8F8F6"></label>
    <button aria-label="Dicter" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #E7E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button aria-label="Envoyer" class="lr-send" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #C6F432; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>
</x-dc>

</body>
</html>
