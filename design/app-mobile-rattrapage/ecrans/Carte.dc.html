<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte des notions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#3A3AA8}a:hover{color:#26267A}
@keyframes lr-grow{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes lr-wave{0%,85%,100%{filter:brightness(1)}92%{filter:brightness(1.25) saturate(1.2)}}
@keyframes lr-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lr-mods>*{animation:lr-in .5s cubic-bezier(.2,.8,.2,1) both}
.lr-mods>*:nth-child(2){animation-delay:.06s}.lr-mods>*:nth-child(3){animation-delay:.12s}.lr-mods>*:nth-child(4){animation-delay:.18s}.lr-mods>*:nth-child(5){animation-delay:.24s}.lr-mods>*:nth-child(6){animation-delay:.3s}
.lr-cell{animation:lr-grow .45s cubic-bezier(.2,.8,.2,1) both,lr-wave 4s ease-in-out infinite}
.lr-cell:nth-child(2){animation-delay:.05s,.15s}.lr-cell:nth-child(3){animation-delay:.1s,.3s}.lr-cell:nth-child(4){animation-delay:.15s,.45s}.lr-cell:nth-child(5){animation-delay:.2s,.6s}.lr-cell:nth-child(6){animation-delay:.25s,.75s}.lr-cell:nth-child(7){animation-delay:.3s,.9s}.lr-cell:nth-child(8){animation-delay:.35s,1.05s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: Inter, sans-serif; color: #111113; display: flex; flex-direction: column">
  <div style="padding: 56px 20px 8px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62626B">Programme · SAP S/4HANA Finance</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 31px; line-height: 1.1">Carte des notions</h1>
  </div>
  <div style="padding: 4px 20px 10px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: #3F3F46">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #0F9F7F"></span>Maîtrisée</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #C6F432"></span>En cours</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #F97316"></span>Fragile</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #DAD9D3"></span>À venir</span>
  </div>
  <div class="lr-mods" style="flex: 1; padding: 4px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{modules}}" as="m" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between"><span style="font-weight: 600; font-size: 14px">{{m.title}}</span><span style="font-size: 12.5px; color: #62626B">{{m.score}}</span></div>
        <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px">
          <sc-for list="{{m.cells}}" as="c" hint-placeholder-count="8">
            <span class="lr-cell" style="height: 22px; border-radius: 6px; background: {{c}}"></span>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = '#0F9F7F', L = '#C6F432', O = '#F97316', N = '#DAD9D3';
    return { modules: [
      { title: '1 · Fondamentaux', score: '6/6', cells: [G, G, G, G, G, G, N, N].slice(0, 6) },
      { title: '2 · Écritures et plan de comptes', score: '6/8', cells: [G, G, G, G, L, G, O, G] },
      { title: '3 · Fournisseurs', score: '3/7', cells: [G, L, O, G, L, G, N] },
      { title: '4 · Clients', score: '1/7', cells: [L, G, N, N, N, N, N] },
      { title: '5 · Immobilisations', score: '0/6', cells: [N, N, N, N, N, N] },
      { title: '6 · Clôture mensuelle', score: '0/8', cells: [O, N, N, N, N, N, N, N] },
    ] };
  }
}
</script>
</body>
</html>
