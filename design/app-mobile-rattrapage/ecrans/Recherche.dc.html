<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#3A3AA8}a:hover{color:#26267A}
@keyframes lr-seek{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(2px,-1px) rotate(-8deg)}50%{transform:translate(-1px,1px) rotate(6deg)}75%{transform:translate(1px,0) rotate(-3deg)}}
@keyframes lr-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes lr-ring{0%,100%{box-shadow:0 0 0 0 rgba(17,17,19,.18)}50%{box-shadow:0 0 0 5px rgba(17,17,19,0)}}
.lr-seek{animation:lr-seek 2.8s ease-in-out infinite;transform-origin:45% 45%}
.lr-field{animation:lr-ring 2.6s ease-in-out infinite}
.lr-results>*{animation:lr-in .5s cubic-bezier(.2,.8,.2,1) both}
.lr-results>*:nth-child(2){animation-delay:.12s}.lr-results>*:nth-child(3){animation-delay:.24s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: Inter, sans-serif; color: #111113; display: flex; flex-direction: column">
  <div style="padding: 56px 20px 12px; display: flex; gap: 10px; align-items: center">
    <label class="lr-field" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 2px solid #111113">
      <svg class="lr-seek" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span style="position: absolute; left: -9999px">Rechercher</span>
      <input value="lettrage" style="flex: 1; border: 0; outline: none; font: 500 15px Inter, sans-serif; background: transparent; color: #111113">
    </label>
    <button style="height: 44px; border: 0; background: transparent; font: 600 14px Inter, sans-serif; color: #3A3AA8">Annuler</button>
  </div>
  <div style="padding: 0 20px 8px; display: flex; gap: 8px">
    <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: #111113; color: #FFFFFF; font: 600 12.5px Inter, sans-serif">Tout</button>
    <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #DAD9D3; background: #FFFFFF; font: 600 12.5px Inter, sans-serif; color: #3F3F46">Notions</button>
    <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #DAD9D3; background: #FFFFFF; font: 600 12.5px Inter, sans-serif; color: #3F3F46">Cours</button>
    <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #DAD9D3; background: #FFFFFF; font: 600 12.5px Inter, sans-serif; color: #3F3F46">Apports</button>
  </div>
  <div class="lr-results" style="flex: 1; padding: 8px 20px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62626B">{{g.label}}</span>
        <div style="background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
            <div style="padding: 12px 14px; border-bottom: 1px solid #EEEDE8; display: flex; flex-direction: column; gap: 3px">
              <span style="font-weight: 600; font-size: 14.5px">{{it.title}}</span>
              <span style="font-size: 12.5px; color: #62626B">{{it.meta}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { groups: [
      { label: 'Notions · 2', items: [
        { title: 'Lettrage des comptes fournisseurs', meta: 'Module 3 · en cours' },
        { title: 'Lettrage automatique (F.13)', meta: 'Module 4 · à venir' },
      ] },
      { label: 'Cours · 1', items: [
        { title: 'Rapprocher factures et paiements', meta: 'Module 3 · chapitre 2 · 12 min' },
      ] },
      { label: 'Apports · 1', items: [
        { title: 'Cours écritures comptables.pdf', meta: 'Page 18 · « le lettrage consiste à… »' },
      ] },
    ] };
  }
}
</script>
</body>
</html>
