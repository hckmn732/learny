<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte des notions — mode cerveau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C6F432}a:hover{color:#E3FF7A}
@keyframes lr-flow{to{stroke-dashoffset:-40}}
@keyframes lr-pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.35)}}
@keyframes lr-breathe{0%,100%{opacity:.55}50%{opacity:1}}
.lr-flow{stroke-dasharray:3 9;animation:lr-flow 2.4s linear infinite}
.lr-pulse{transform-box:fill-box;transform-origin:center;animation:lr-pulse 1.8s ease-in-out infinite}
.lr-breathe{animation:lr-breathe 3.2s ease-in-out infinite}
.lr-node{cursor:pointer}
@media (prefers-reduced-motion: reduce){.lr-flow,.lr-pulse,.lr-breathe{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 70% at 50% 35%, #1A1D12 0%, #0B0B0F 60%); font-family: Inter, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 56px 20px 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A1A1AA">SAP S/4HANA Finance</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.05">Ton cerveau</h1>
    </div>
    <div role="group" aria-label="Vue" style="display: flex; padding: 3px; border-radius: 999px; background: #1C1C21; border: 1px solid #2E2E35">
      <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: #C6F432; color: #111113; font: 700 12px Inter, sans-serif">Cerveau</button>
      <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: #A1A1AA; font: 600 12px Inter, sans-serif">Liste</button>
    </div>
  </div>
  <div style="padding: 6px 20px 0; display: flex; gap: 14px; font-size: 12.5px; color: #D4D4D8">
    <span><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #34D399">19</strong> maîtrisées</span>
    <span><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #C6F432">11</strong> en cours</span>
    <span><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #FDBA74">4</strong> fragiles</span>
  </div>
  <div style="padding: 10px 20px 0; display: flex; gap: 8px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button onClick="{{f.pick}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.ink}}; font: 600 12px Inter, sans-serif">{{f.label}}</button>
    </sc-for>
  </div>

  <svg viewBox="0 0 390 470" width="390" height="470" role="img" aria-label="Réseau des notions et de leurs liens" style="display: block; margin-top: 4px">
    <defs>
      <filter id="lr-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="lr-soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <sc-for list="{{halos}}" as="h" hint-placeholder-count="6">
      <circle cx="{{h.x}}" cy="{{h.y}}" r="{{h.r}}" fill="{{h.c}}" opacity="0.14" filter="url(#lr-soft)" class="lr-breathe"></circle>
    </sc-for>
    <sc-for list="{{edges}}" as="e" hint-placeholder-count="30">
      <line x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{e.c}}" stroke-width="{{e.w}}" opacity="{{e.o}}" stroke-linecap="round"></line>
    </sc-for>
    <sc-for list="{{flows}}" as="e" hint-placeholder-count="10">
      <line x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{e.c}}" stroke-width="2" opacity="0.9" stroke-linecap="round" class="lr-flow"></line>
    </sc-for>
    <sc-for list="{{clusters}}" as="k" hint-placeholder-count="6">
      <text x="{{k.x}}" y="{{k.y}}" text-anchor="middle" fill="#71717A" font-size="10" font-weight="600" letter-spacing="1.2" font-family="Inter, sans-serif">{{k.label}}</text>
    </sc-for>
    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="26">
      <g class="lr-node" onClick="{{n.pick}}">
        <sc-if value="{{n.fragile}}" hint-placeholder-val="{{ false }}">
          <circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.ring}}" fill="none" stroke="#F97316" stroke-width="2" class="lr-pulse"></circle>
        </sc-if>
        <sc-if value="{{n.selected}}" hint-placeholder-val="{{ false }}">
          <circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.sel}}" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
        </sc-if>
        <circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.r}}" fill="{{n.c}}" opacity="{{n.o}}" filter="url(#lr-glow)"></circle>
        <circle cx="{{n.x}}" cy="{{n.y}}" r="14" fill="transparent"></circle>
      </g>
    </sc-for>
    <text x="195" y="236" text-anchor="middle" fill="#111113" font-size="9.5" font-weight="700" font-family="Inter, sans-serif">CG</text>
  </svg>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 22px; background: rgba(24,24,28,0.92); border: 1px solid #2E2E35; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 40px rgba(0,0,0,0.45)">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{sel.tone}}">{{sel.state}} · {{sel.module}}</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{sel.name}}</span>
      </div>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: {{sel.tone}}">{{sel.pct}}</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #2A2A2E; overflow: hidden"><div style="height: 6px; width: {{sel.pct}}; background: {{sel.tone}}"></div></div>
    <span style="font-size: 13px; line-height: 1.45; color: #D4D4D8">{{sel.links}}</span>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 46px; border-radius: 999px; border: 0; background: #C6F432; color: #111113; font: 700 14px Inter, sans-serif">Réviser · 3 min</button>
      <button style="height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid #3F3F46; background: transparent; color: #FFFFFF; font: 600 14px Inter, sans-serif">Demander au tuteur</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: 'fnp', filter: 'all' };
  }
  renderVals() {
    const C = { m: '#34D399', c: '#C6F432', f: '#F97316', n: '#52525B', hub: '#C6F432' };
    const label = { m: 'Maîtrisée', c: 'En cours', f: 'Fragile', n: 'À venir' };
    const raw = [
      { id: 'hub', x: 195, y: 232, s: 'c', r: 17, name: 'Comptabilité générale', module: 'Socle', pct: 72 },
      { id: 'a1', x: 70, y: 70, s: 'm', name: 'Organisation financière', module: 'Module 1', pct: 96 },
      { id: 'a2', x: 118, y: 52, s: 'm', name: 'Société et exercice', module: 'Module 1', pct: 94 },
      { id: 'a3', x: 92, y: 112, s: 'm', name: 'Devise et période', module: 'Module 1', pct: 91 },
      { id: 'b1', x: 178, y: 92, s: 'm', name: 'Plan de comptes', module: 'Module 2', pct: 93 },
      { id: 'b2', x: 226, y: 78, s: 'm', name: 'Pièce comptable', module: 'Module 2', pct: 90 },
      { id: 'b3', x: 214, y: 132, s: 'c', name: 'Écritures récurrentes', module: 'Module 2', pct: 64 },
      { id: 'b4', x: 160, y: 140, s: 'm', name: 'Comptes généraux', module: 'Module 2', pct: 88 },
      { id: 'c1', x: 300, y: 118, s: 'c', name: 'Facture fournisseur', module: 'Module 3', pct: 70 },
      { id: 'c2', x: 340, y: 160, s: 'f', name: 'Lettrage fournisseurs', module: 'Module 3', pct: 38 },
      { id: 'c3', x: 296, y: 196, s: 'c', name: 'Paiement automatique', module: 'Module 3', pct: 58 },
      { id: 'd1', x: 62, y: 214, s: 'c', name: 'Facture client', module: 'Module 4', pct: 61 },
      { id: 'd2', x: 98, y: 262, s: 'n', name: 'Relances', module: 'Module 4', pct: 0 },
      { id: 'd3', x: 46, y: 300, s: 'n', name: 'Encaissements', module: 'Module 4', pct: 0 },
      { id: 'e1', x: 160, y: 330, s: 'n', name: 'Fiche immobilisation', module: 'Module 5', pct: 0 },
      { id: 'e2', x: 208, y: 372, s: 'f', name: 'Amortissement dégressif', module: 'Module 5', pct: 31 },
      { id: 'e3', x: 132, y: 392, s: 'n', name: 'Cessions', module: 'Module 5', pct: 0 },
      { id: 'fnp', x: 300, y: 300, s: 'f', name: 'Factures non parvenues', module: 'Module 6', pct: 27 },
      { id: 'f2', x: 344, y: 340, s: 'n', name: 'Charges constatées d’avance', module: 'Module 6', pct: 0 },
      { id: 'f3', x: 288, y: 370, s: 'f', name: 'Extournes', module: 'Module 6', pct: 22 },
      { id: 'f4', x: 330, y: 410, s: 'n', name: 'Clôture du mois', module: 'Module 6', pct: 0 },
    ];
    const links = [
      ['hub','a1'],['hub','b1'],['hub','b4'],['hub','c1'],['hub','d1'],['hub','e1'],['hub','fnp'],['hub','c3'],
      ['a1','a2'],['a1','a3'],['a2','b2'],['a3','b4'],['b1','b2'],['b1','b4'],['b2','b3'],['b3','c1'],
      ['c1','c2'],['c1','c3'],['c2','c3'],['d1','d2'],['d1','d3'],['d2','d3'],['b4','d1'],
      ['e1','e2'],['e1','e3'],['e2','e3'],['e2','fnp'],['fnp','f2'],['fnp','f3'],['f3','f4'],['f2','f4'],['c3','fnp'],
    ];
    const byId = Object.fromEntries(raw.map((n) => [n.id, n]));
    const filter = this.state.filter;
    const visible = (n) => filter === 'all' || (filter === 'fragile' && n.s === 'f') || (filter === 'module' && n.module === 'Module 6') || (filter === 'progress' && n.s === 'c');
    const nodes = raw.map((n) => {
      const r = n.r ?? (n.s === 'n' ? 6 : 8);
      return {
        x: n.x, y: n.y, r, c: n.id === 'hub' ? C.hub : C[n.s],
        o: visible(n) || n.id === 'hub' ? 1 : 0.18,
        ring: r + 7, sel: r + 6, fragile: n.s === 'f' && visible(n),
        selected: n.id === this.state.selected,
        pick: () => this.setState({ selected: n.id }),
      };
    });
    const tone = (s) => (s === 'n' ? '#A1A1AA' : C[s]);
    const edges = links.map(([a, b]) => {
      const A = byId[a], B = byId[b];
      const live = visible(A) && visible(B);
      const hot = A.s === 'f' || B.s === 'f';
      return { x1: A.x, y1: A.y, x2: B.x, y2: B.y, c: hot ? '#F97316' : (A.s === 'n' || B.s === 'n' ? '#3F3F46' : '#C6F432'), w: hot ? 1.4 : 1, o: live ? (hot ? 0.55 : 0.32) : 0.08 };
    });
    const sel = byId[this.state.selected];
    const neighbours = links.filter((l) => l.includes(sel.id)).map((l) => byId[l[0] === sel.id ? l[1] : l[0]].name);
    const flows = links.filter((l) => l.includes(sel.id)).map(([a, b]) => ({ x1: byId[a].x, y1: byId[a].y, x2: byId[b].x, y2: byId[b].y, c: tone(sel.s) === '#A1A1AA' ? '#C6F432' : tone(sel.s) }));
    const clusters = [
      { x: 92, y: 30, label: 'FONDAMENTAUX' }, { x: 200, y: 62, label: 'ÉCRITURES' }, { x: 318, y: 96, label: 'FOURNISSEURS' },
      { x: 70, y: 190, label: 'CLIENTS' }, { x: 170, y: 430, label: 'IMMOBILISATIONS' }, { x: 318, y: 278, label: 'CLÔTURE' },
    ];
    const halos = [
      { x: 92, y: 80, r: 46, c: C.m }, { x: 195, y: 110, r: 54, c: C.m }, { x: 312, y: 158, r: 48, c: C.c },
      { x: 70, y: 258, r: 46, c: C.n }, { x: 168, y: 364, r: 50, c: C.f }, { x: 314, y: 352, r: 56, c: C.f },
    ];
    const f = (id, text) => {
      const on = this.state.filter === id;
      return { label: text, pick: () => this.setState({ filter: id }), bg: on ? '#FFFFFF' : 'transparent', ink: on ? '#111113' : '#D4D4D8', border: on ? '#FFFFFF' : '#3F3F46' };
    };
    return {
      nodes, edges, flows, clusters, halos,
      filters: [f('all', 'Tout'), f('fragile', 'Fragiles'), f('progress', 'En cours'), f('module', 'Module 6')],
      sel: {
        name: sel.name, module: sel.module, state: sel.id === 'hub' ? 'Notion centrale' : label[sel.s],
        pct: sel.pct + '%', tone: sel.id === 'hub' ? C.hub : tone(sel.s),
        links: 'Reliée à ' + neighbours.slice(0, 3).join(', ') + (neighbours.length > 3 ? ' et ' + (neighbours.length - 3) + ' autre(s).' : '.'),
      },
    };
  }
}
</script>
</body>
</html>
