
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages-py/learny", "apps/api-py", "apps/worker-py"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py313"
exclude = ["node_modules", ".next", ".venv", "dist", "test-results", "coverage", "docs", "evidence", "design"]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "ASYNC", "RUF", "SIM", "PT", "TID"]
ignore = ["S101"] # plain asserts are the single assertion style of the test suite

[tool.ruff.lint.per-file-ignores]
# The system clock is the one legitimate use of datetime.now(): every other module goes through it.
"packages-py/learny/src/learny/shared/clock.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "use deps.clock.now()"
"datetime.datetime.utcnow".msg = "use deps.clock.now()"
"time.time".msg = "use deps.clock"
"random".msg = "use learny.shared.prng"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages-py/learny/src", "apps/api-py/src", "apps/worker-py/src"]
exclude = ["generated/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["spec(id): SDD spec id"]
testpaths = ["packages-py", "apps/api-py", "apps/worker-py"]
pythonpath = ["packages-py/learny/src", "apps/api-py/src", "apps/worker-py/src"]

[tool.importlinter]
root_packages = ["learny", "learny_api", "learny_worker"]

[[tool.importlinter.contracts]]
name = "Nobody imports views or apps"
type = "forbidden"
source_modules = ["learny.shared", "learny.platform"]
forbidden_modules = ["learny.views", "learny_api", "learny_worker"]
