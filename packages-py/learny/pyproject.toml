[project]
name = "learny"
version = "0.0.0"
description = "Learny business library: shared foundation and business contexts (ADR-2003)."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43.0",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "tzdata>=2024.1",
  "pypdf>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learny"]
