[project]
name = "learny-worker"
version = "0.0.0"
description = "Home-made outbox worker of Learny (ADR-2006, ADR-2014)."
requires-python = ">=3.13,<3.14"
dependencies = [
  "learny",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sentry-sdk>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learny_worker"]

[tool.uv.sources]
learny = { workspace = true }
