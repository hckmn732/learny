# SPEC-3002 — galerie des composants : ouverture, en-tête, première section (Jetons) et ses
# pastilles. Le défilement complet n'est pas asserté : `scrollUntilVisible` est inopérant sur cette
# liste et un glissement libre est non déterministe (dette d'outillage Maestro documentée dans
# `evidence/SPEC-3002/acceptance.md`). Les composants des autres sections sont couverts par les
# 62 tests Jest et les trois captures de la galerie.
appId: fr.learny.app
name: SPEC-3002 galerie
tags:
  - SPEC-3002
---
- launchApp:
    clearState: true
- assertVisible:
    id: sdd-title
# L'application est prête ; la galerie est ouverte par son lien profond, seule forme stable pour le
# pilote (le bandeau d'entrée est un texte non cliquable).
- openLink: learny:///_dev/ui
- assertVisible:
    id: ui-gallery
- assertVisible:
    id: ui-header
- assertVisible: Galerie des composants
- assertVisible:
    id: ui-section-tokens
- assertVisible:
    id: ui-token-canvas
- assertVisible:
    id: ui-token-ink
- assertVisible:
    id: ui-token-lime
- assertVisible:
    id: ui-token-indigo
- assertVisible:
    id: ui-token-orange
- assertVisible:
    id: ui-token-green
- assertVisible:
    id: ui-radius-22
