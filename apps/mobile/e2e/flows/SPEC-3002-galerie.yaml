# SPEC-3002 — galerie des composants : défilement des sept sections, sélection dans le contrôle
# segmenté, bascule de l'interrupteur, apparition d'un toast et ouverture d'une feuille.
# Le défilement passe par `scroll-to.yaml` : la boucle s'arrête dès que la cible est visible,
# ce qui reste vrai quelle que soit l'inertie de la liste.
appId: fr.learny.app
name: SPEC-3002 galerie
tags:
  - SPEC-3002
---
- launchApp:
    clearState: true
- assertVisible:
    id: sdd-title
# L'application est prête ; la galerie est ouverte par son lien profond, seule forme stable pour le
# pilote (le bandeau d'entrée est un texte non cliquable).
- openLink: learny:///_dev/ui
- assertVisible:
    id: ui-gallery
- assertVisible:
    id: ui-header
- assertVisible: Galerie des composants

# Jetons (en haut de la galerie)
- assertVisible:
    id: ui-token-lime
- takeScreenshot: SPEC-3002-jetons

# Boutons
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-button-primary
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-button-loading
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- assertVisible:
    id: ui-button-loading

# Cartes et puces
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-stat-streak
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-card-ink
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- assertVisible:
    id: ui-card-ink
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-chip-green
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500

# Contrôles : sélection et interrupteur (EF-4)
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-segmented
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- tapOn:
    id: ui-segmented-month
- assertVisible: month
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-switch-control
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- tapOn:
    id: ui-switch-control
- assertVisible: Désactivé
- takeScreenshot: SPEC-3002-controles

# Listes
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-row-course
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-row-switch-control
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- assertVisible:
    id: ui-row-switch-control

# Feuilles et retours : toast puis feuille
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-toast-trigger
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- tapOn:
    id: ui-toast-trigger
- extendedWaitUntil:
    visible: Séance reportée à demain 9:00.
    timeout: 10000
- takeScreenshot: SPEC-3002-feuilles
- tapOn:
    id: ui-sheet-open
- assertVisible:
    id: ui-sheet
- assertVisible:
    id: ui-sheet-close
- tapOn:
    id: ui-sheet-close
- assertNotVisible:
    id: ui-sheet

# États (bas de la galerie)
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-skeleton
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-error
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- assertVisible:
    id: ui-error
