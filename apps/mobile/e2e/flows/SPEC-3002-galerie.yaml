# SPEC-3002 — galerie des composants : défilement des sept sections, sélection dans le contrôle
# segmenté, bascule de l'interrupteur, apparition d'un toast et ouverture d'une feuille.
# La galerie est une longue liste : les déplacements sont des glissements de 60 % de la hauteur
# d'écran, dont les positions ont été relevées sur l'émulateur (une section fait plus d'un écran,
# et Maestro exige 100 % de visibilité pour `scrollUntilVisible`).
appId: fr.learny.app
name: SPEC-3002 galerie
tags:
  - SPEC-3002
---
- launchApp:
    clearState: true
- assertVisible:
    id: sdd-title
# L'application est prête ; la galerie est ouverte par son lien profond, seule forme stable pour le
# pilote (le bandeau d'entrée est un texte non cliquable).
- openLink: learny:///_dev/ui
- assertVisible:
    id: ui-gallery
- assertVisible:
    id: ui-header
- assertVisible: Galerie des composants

# Jetons (en haut de la galerie)
- assertVisible:
    id: ui-token-lime
- takeScreenshot: SPEC-3002-jetons

# Boutons
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 300
- assertVisible:
    id: ui-button-primary
- assertVisible:
    id: ui-button-loading

# Cartes et puces
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 300
- assertVisible:
    id: ui-stat-streak
- assertVisible:
    id: ui-card-ink
- assertVisible:
    id: ui-chip-green

# Contrôles : sélection et interrupteur (EF-4)
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 300
- assertVisible:
    id: ui-segmented
- tapOn:
    id: ui-segmented-month
- assertVisible: month
- tapOn:
    id: ui-switch-control
- assertVisible: Désactivé
- takeScreenshot: SPEC-3002-controles

# Listes
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 300
- assertVisible:
    id: ui-row-course
- assertVisible:
    id: ui-row-switch-control

# Feuilles et retours : toast puis feuille
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 300
- assertVisible:
    id: ui-toast-trigger
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 300
- tapOn:
    id: ui-toast-trigger
- assertVisible:
    id: ui-toast
- assertVisible: Séance reportée à demain 9:00.
- takeScreenshot: SPEC-3002-feuilles
- tapOn:
    id: ui-sheet-open
- assertVisible:
    id: ui-sheet
- assertVisible:
    id: ui-sheet-close
- tapOn:
    id: ui-sheet-close
- assertNotVisible:
    id: ui-sheet

# États (bas de la galerie)
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 300
- assertVisible:
    id: ui-skeleton
- assertVisible:
    id: ui-error
