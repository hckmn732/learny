# SPEC-3002 — comparaison visuelle de la section « Contrôles » (CA-4, ADR-3003 § 4).
# Une capture par flux : le harnais compare la première image au fichier de référence versionné
# `e2e/visual/baselines/SPEC-3002-controles.png`. Le contrôle segmenté est sur « Mois » et
# l'interrupteur éteint : l'état comparé est stable.
appId: fr.learny.app
name: SPEC-3002 controles
tags:
  - SPEC-3002
  - visual
---
- launchApp:
    clearState: true
- assertVisible:
    id: sdd-title
- openLink: learny:///_dev/ui
- assertVisible:
    id: ui-gallery
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-segmented
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- tapOn:
    id: ui-segmented-month
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-switch-control
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- tapOn:
    id: ui-switch-control
- assertVisible: Désactivé
- takeScreenshot: SPEC-3002-controles
