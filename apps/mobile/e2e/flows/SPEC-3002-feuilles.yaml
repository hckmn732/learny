# SPEC-3002 — comparaison visuelle des « Feuilles et retours » (CA-4).
# La feuille est ouverte : la capture compare le voile, la poignée, le titre et le corps.
appId: fr.learny.app
name: SPEC-3002 feuilles
tags:
  - SPEC-3002
---
- launchApp:
    clearState: true
- assertVisible:
    id: sdd-title
- openLink: learny:///_dev/ui
- assertVisible:
    id: ui-gallery
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-banner-offline
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- assertVisible:
    id: ui-banner-info
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: ui-sheet-open
          commands:
            - swipe:
                start: 50%, 72%
                end: 50%, 36%
                duration: 500
- tapOn:
    id: ui-sheet-open
- assertVisible:
    id: ui-sheet
- takeScreenshot: SPEC-3002-feuilles
