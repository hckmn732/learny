# SPEC-3302 — lecture du cours : ouverture depuis Programme, corps, sommaire (CA-1, CA-5, EF-6).
#
# Unique flux `@visual` de la spécification (leçon 6 du BRIEF, ADR-3015 § 5) : la capture
# `SPEC-3302-lecture` montre le haut du chapitre 2 (« Saisie des pièces comptables », chapitre 2
# sur 4, barre de lecture) et est comparée à la ligne de base versionnée
# `e2e/visual/baselines/SPEC-3302-lecture.png` (masque : barre d'état et indicateur d'accueil, le
# reste est du contenu).
#
# Le flux ne mute rien : il ne fait aucun défilement de l'article (la progression envoyée porte
# alors sur le chapitre déjà lu à 100 %, valeur monotone, BR-COU-08) et n'ouvre que le sommaire, qui
# est une lecture. Les états plus bas (question éclair, citation, résumé) sont couverts par les
# tests de composants et le test d'intégration, et capturés dans `evidence/SPEC-3302/`.
#
# Le chapitre 2 est ouvert par sa rangée dans le module 3 : « Reprendre » du Programme pointe le
# chapitre en cours de lecture (le 3), pas le chapitre 2 de la maquette. Les identifiants de la
# rangée et des sections sont ceux du jeu de démonstration SPEC-115 (identifiants déterministes).
appId: fr.learny.app
name: SPEC-3302 lecture
tags:
  - SPEC-3302
  - visual
---
- launchApp:
    clearState: true
# Page d'accueil des builds SDD : l'application est prête à recevoir le lien profond.
- extendedWaitUntil:
    visible:
      id: sdd-health
    timeout: 30000
- openLink: learny://connexion?demo=1
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: onboarding-error
    commands:
      - tapOn:
          id: onboarding-error-retry
- extendedWaitUntil:
    visible:
      id: tab-programme
    timeout: 60000
- tapOn:
    id: tab-programme
- extendedWaitUntil:
    visible:
      id: programme-screen
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: programme-formation-card
    timeout: 20000
# CA-1 — la rangée du chapitre 2 ouvre l'écran Cours natif, empilé au-dessus des onglets (EF-1).
- swipe:
    start: 50%, 80%
    end: 50%, 45%
    duration: 500
- extendedWaitUntil:
    visible:
      id: chapter-74e85d27-6960-51a1-b712-ab9cc7aba756
    timeout: 20000
- tapOn:
    id: chapter-74e85d27-6960-51a1-b712-ab9cc7aba756
- extendedWaitUntil:
    visible:
      id: course-header
    timeout: 20000
- assertVisible:
    id: course-title
- assertVisible:
    id: course-module-tag
- assertVisible:
    id: course-meta
- assertVisible:
    id: course-progress
- assertVisible:
    id: course-toc
- assertVisible:
    id: course-ask-tutor
- assertVisible:
    id: course-open-quiz
# EF-2 — le corps commence par le Markdown de la section « Présentation ».
- assertVisible:
    id: course-markdown
# CA-5 — état de la maquette : haut du chapitre 2, barre de lecture.
- takeScreenshot: SPEC-3302-lecture
# EF-6 — le sommaire liste les quatre chapitres et les sections du chapitre courant (BR-COU-11).
- tapOn:
    id: course-toc
- extendedWaitUntil:
    visible:
      id: course-toc-sheet
    timeout: 15000
- assertVisible:
    id: course-toc-chapter-74e85d27-6960-51a1-b712-ab9cc7aba756
- assertVisible:
    id: course-toc-section-fb0a6111-aa92-5632-9fe2-a8fc00cf1288
- assertVisible:
    id: course-toc-section-d46c099c-d636-5e7f-902d-f87a8c7cd434
- tapOn:
    id: course-toc-sheet-close
- extendedWaitUntil:
    visible:
      id: course-header
    timeout: 10000
# BR-NAV-04 — le retour ramène à l'onglet Programme.
- tapOn:
    id: course-back
- extendedWaitUntil:
    visible:
      id: programme-screen
    timeout: 20000
