# SPEC-3202 — programme, modules, chapitres et reprise (CA-1, CA-2, CA-3, CA-4).
#
# Unique flux `@visual` de la spécification (ADR-3015 § 5) : il capture la vue Modules de l'onglet
# Programme dans l'état de la maquette du 11 novembre 2026 (formation SAP à 38 %, module 3 déplié,
# module 4 verrouillé, module 2 validé), comparée à la référence
# `design/app-mobile/exports/screens/android-03-programme.png` (ADR-3003 § 4).
#
# Précautions Maestro 2.12.1 : matcher `text` ancré et accents abîmés en transit, donc les
# assertions de texte restent ASCII et les nœuds vérifiés portent un `id`.
appId: fr.learny.app
name: SPEC-3202 programme
tags:
  - SPEC-3202
  - visual
---
- launchApp:
    clearState: true
# Page d'accueil des builds SDD : l'application est prête à recevoir le lien profond.
- extendedWaitUntil:
    visible:
      id: sdd-health
    timeout: 30000
- openLink: learny://connexion?demo=1
- extendedWaitUntil:
    visible:
      id: tab-programme
    timeout: 60000
- tapOn:
    id: tab-programme
- extendedWaitUntil:
    visible:
      id: programme-screen
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: programme-formation-card
    timeout: 20000
# CA-1 — les valeurs de démonstration de la carte formation et du module 3.
- assertVisible:
    text: '29 %'
- assertVisible:
    text: 'Module 3 sur 7.*'
- assertVisible:
    id: module-3
- assertVisible:
    id: programme-resume
- assertVisible:
    id: programme-segmented
- assertVisible:
    id: programme-import
# CA-1 — le module 2 validé et le module 4 verrouillé sont présents.
- assertVisible:
    id: module-2
- assertVisible:
    id: module-4
# CA-2 — un module verrouillé ouvre sa fiche de déblocage, sans chapitres.
- tapOn:
    id: module-4-toggle
- extendedWaitUntil:
    visible:
      id: programme-locked
    timeout: 10000
- assertVisible:
    text: 'Compris'
- tapOn:
    text: 'Compris'
# CA-3 — le sélecteur de formation liste l'active et la formation en pause.
- tapOn:
    id: programme-formation-card
- extendedWaitUntil:
    visible:
      id: formation-switcher
    timeout: 10000
- assertVisible:
    text: 'SAP S/4HANA Finance'
- tapOn:
    id: formation-switcher-close
# CA-4 — l'import renvoie au web, sans écriture du programme.
- tapOn:
    id: programme-import
- extendedWaitUntil:
    visible:
      id: programme-web-import
    timeout: 10000
- assertVisible:
    text: 'Continuer sur le web'
- tapOn:
    id: programme-web-import-close
# CA-5 — état de la maquette : vue Modules, module 3 déplié.
- assertVisible:
    id: programme-formation-card
- takeScreenshot: SPEC-3202-programme
# EF-6 — la vue Calendrier reste accessible et affiche la grille.
- tapOn:
    id: programme-segmented-calendrier
- extendedWaitUntil:
    visible:
      id: programme-calendar
    timeout: 10000
- assertVisible:
    text: 'Calendrier de la formation'
