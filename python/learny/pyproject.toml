[project]
name = "learny"
version = "0.0.0"
description = "Learny business library: shared foundation and business contexts (ADR-2003)."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43.0",
  "httpx[http2]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "tzdata>=2024.1",
  "pypdf>=5.1",
  "readability-lxml>=0.8.1",
  "lxml-html-clean>=0.4",
  "youtube-transcript-api>=1.0",
  "pgvector>=0.3.6",
  "jinja2>=3.1",
  "aiosmtplib>=3.0",
  "pywebpush>=2.0",
  # Native push channels (SPEC-3501 ET-2, ADR-3007, ADR-2015): OAuth token of the FCM service
  # account. APNs signs its provider token with PyJWT, already required above.
  "google-auth>=2.35",
  "stripe>=17.1,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learny"]
